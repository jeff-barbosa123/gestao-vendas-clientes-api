name: ci

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sgvc_test
          POSTGRES_USER: sgvc
          POSTGRES_PASSWORD: sgvc123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgvc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: postgresql://sgvc:sgvc123@localhost:5432/sgvc_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789
      ALLOWED_ORIGINS: http://localhost:4000
      ADMIN_EMAIL: admin@sgvc.local
      ADMIN_PASSWORD: Admin@123!
      OTHER_USER_EMAIL: user@sgvc.local
      OTHER_USER_PASSWORD: User@123!
      GLOBAL_RATE_LIMIT_MAX: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Prepare database (schema + migrations + seed)
        working-directory: api
        run: |
          node -e "require('./src/db').initDb().then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); })"
          node scripts/seed-users.js

      - name: Run API tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: api/mochawesome-report
          if-no-files-found: ignore

  e2e-tests:
    runs-on: ubuntu-latest
    needs: api-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sgvc_test
          POSTGRES_USER: sgvc
          POSTGRES_PASSWORD: sgvc123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgvc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CI: true
      PORT: 3000
      DATABASE_URL: postgresql://sgvc:sgvc123@localhost:5432/sgvc_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789
      ALLOWED_ORIGINS: http://localhost:4000
      ADMIN_EMAIL: admin@sgvc.local
      ADMIN_PASSWORD: Admin@123!
      OTHER_USER_EMAIL: user@sgvc.local
      OTHER_USER_PASSWORD: User@123!
      GLOBAL_RATE_LIMIT_MAX: 5000
      # Usuário do fluxo completo (backend real)
      CYPRESS_E2E_EMAIL: admin@sgvc.local
      CYPRESS_E2E_PASSWORD: Admin@123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (raiz + api + Cypress)
        run: npm ci

      - name: Install web deps
        run: npm ci --prefix web

      - name: Prepare database (schema + migrations + seed)
        working-directory: api
        run: |
          node -e "require('./src/db').initDb().then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); })"
          node scripts/seed-users.js

      - name: Start API and web
        run: |
          nohup node api/src/server.js > api.log 2>&1 &
          # PORT do job é da API; o frontend fica na 4000
          PORT=4000 nohup npm --prefix web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null && curl -sf http://127.0.0.1:4000/ > /dev/null; then
              echo "API e web no ar"; exit 0
            fi
            sleep 2
          done
          echo "--- api.log ---"; cat api.log; echo "--- web.log ---"; cat web.log
          exit 1

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: electron

      - name: Server logs
        if: failure()
        run: |
          echo "--- api.log ---"; tail -n 200 api.log || true
          echo "--- web.log ---"; tail -n 50 web.log || true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

