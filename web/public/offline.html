<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>SGVC | Sem conexão</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 360px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #60a5fa; color: #0f172a; font-weight: 700; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não foi possível falar com o SGVC. Confira sua internet e tente de novo. Suas vendas e dados continuam salvos no servidor.</p>
      <button type="button" id="retry">Tentar novamente</button>
    </main>
    <script src="/static/offline.js" defer></script>
  </body>
</html>
