<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SGVC | Redefinir senha</title>
    <meta
      name="description"
      content="Redefina sua senha do SGVC de forma segura."
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/static/base.css" />
    <link rel="stylesheet" href="/static/login.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <main id="main">
      <div class="background">
        <div class="login-wrapper">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img" focusable="false">
                <circle cx="24" cy="24" r="22" class="brand-ring"></circle>
                <path
                  class="brand-wave"
                  d="M10 28c6-6 12-4 18-10 4-4 8-6 10-4v10c-2-2-6 0-10 4-6 6-12 4-18 10z"
                ></path>
              </svg>
            </div>
            <h1>SGVC</h1>
            <span>Gestão de Vendas e Clientes</span>
          </div>

          <div class="login-card">
            <h2 class="login-title">Redefinir senha</h2>
            <p class="login-subtitle">Crie uma nova senha para acessar</p>

            <div id="reset-error" class="login-error" role="alert" aria-live="assertive" hidden>
              <span class="login-error-icon" aria-hidden="true">!</span>
              <span id="reset-error-text"></span>
            </div>
            <div id="reset-success" class="login-success" role="status" aria-live="polite" hidden>
              <span class="login-success-icon" aria-hidden="true">OK</span>
              <span id="reset-success-text"></span>
            </div>

            <form id="reset-form" novalidate>
              <div class="field">
                <label class="label" for="new-password">Nova senha</label>
                <input
                  class="input"
                  type="password"
                  id="new-password"
                  name="new-password"
                  autocomplete="new-password"
                  required
                  aria-required="true"
                />
                <p class="help">A senha deve ter pelo menos 8 caracteres, incluindo letras maiúsculas, minúsculas, números e caracteres especiais.</p>
                <p class="help is-danger" id="new-password-error" aria-live="polite" hidden></p>
              </div>

              <div class="field">
                <label class="label" for="confirm-password">Confirmar senha</label>
                <input
                  class="input"
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  autocomplete="new-password"
                  required
                  aria-required="true"
                />
                <p class="help is-danger" id="confirm-error" aria-live="polite" hidden></p>
              </div>

              <button class="btn-login" type="submit" id="reset-submit">Atualizar senha</button>
            </form>

            <p class="register-link" style="margin-top: 12px;">
              <a class="link-button" href="/index.html">Voltar para o login</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      &copy; SGVC &middot; Vers&atilde;o 1.0.0
    </footer>

    <script src="/static/reset-password.js" defer></script>
  </body>
</html>
